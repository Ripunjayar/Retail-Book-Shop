# LEARNING ONLY: local Redis configuration example.
# Redis is temporary/shared state; the database remains the source of truth.

port 6379
bind 127.0.0.1
protected-mode yes
timeout 0

# Limit memory used by cache entries.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Example application key TTL: 15 minutes.
# The application normally applies this TTL when writing keys.

# Production Redis should use authentication, TLS, private networking,
# monitoring, backups, and managed failover.
